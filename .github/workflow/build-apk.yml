name: Build Android APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q AI-Clip-Studio-updated.zip
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install Flet build tooling
        run: pip install "flet-cli>=0.80,<1" "flet>=0.80,<1" "flet-video>=0.80,<1" "httpx2>=2,<3"
      - name: Build APK
        run: flet build apk --yes
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: ai-clip-studio-apk
          path: proj/build/apk/*.apk
